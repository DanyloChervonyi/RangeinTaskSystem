apiVersion: v1
kind: Secret
metadata:
  name: rangein-secret
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "rangein-postgres-dev-password"
  POSTGRES_DB: "rangein_task_system"
  DATABASE_URL: "postgresql://postgres:rangein-postgres-dev-password@postgres:5432/rangein_task_system?schema=public"
  JWT_SECRET: "rangein-k8s-dev-jwt-secret-change-before-prod"
  JWT_EXPIRES_IN: "7d"
  RABBITMQ_DEFAULT_USER: "rabbit"
  RABBITMQ_DEFAULT_PASS: "rangein-rabbitmq-dev-password"
  RABBITMQ_URL: "amqp://rabbit:rangein-rabbitmq-dev-password@rabbitmq:5672"
