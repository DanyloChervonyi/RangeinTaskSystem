apiVersion: v1
kind: Secret
metadata:
  name: rangein-secret
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "rangein_task_system"
  DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/rangein_task_system?schema=public"
  JWT_SECRET: "change-me-before-development"
  JWT_EXPIRES_IN: "7d"
  RABBITMQ_DEFAULT_USER: "rabbit"
  RABBITMQ_DEFAULT_PASS: "rabbit"
  RABBITMQ_URL: "amqp://rabbit:rabbit@rabbitmq:5672"
