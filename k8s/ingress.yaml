apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rangein-ingress
spec:
  rules:
    - host: rangein.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
